<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add / Edit Job | JobSearch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="navbar container">
      <a href="index.html" class="navbar__brand">JobSearch</a>
      <input type="checkbox" id="nav-toggle" class="sr-only">
      <label for="nav-toggle" class="navbar__toggle" aria-label="Menu">&#9776;</label>
      <ul class="navbar__links">
        <li><a href="index.html">Home</a></li>
        <li><a href="admin-dashboard.html">My Job Postings</a></li>
        <li><a href="job-form.html" aria-current="page">Add Job</a></li>
        <li><span class="chip">TechNova - Company Admin</span></li>
        <li><a href="index.html">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>Post a New Job</h1>
      <p class="text-muted">Fill out the details below to publish a new job opportunity.</p>
    </div>

    <section class="section">
      <div class="card" style="max-width: 600px; margin: 0 auto;">
        <form action="admin-dashboard.html" method="get">
          
          <div class="form-group" style="margin-bottom: 1rem;">
            <label for="job-title" class="form-label">Job Title *</label>
            <input type="text" id="job-title" name="title" class="form-control" placeholder="e.g. Frontend Developer" required>
          </div>

          <div class="form-group" style="margin-bottom: 1rem;">
            <label for="job-salary" class="form-label">Salary (EGP/month) *</label>
            <input type="text" id="job-salary" name="salary" class="form-control" placeholder="e.g. 18,000 EGP" required>
          </div>

          <div class="form-group" style="margin-bottom: 1rem;">
            <label for="job-exp" class="form-label">Required Years of Experience *</label>
            <input type="number" id="job-exp" name="experience" class="form-control" placeholder="e.g. 2" min="0" required>
          </div>

          <div class="form-group" style="margin-bottom: 1rem;">
            <label for="job-status" class="form-label">Job Status *</label>
            <select id="job-status" name="status" class="form-control" required>
              <option value="open">Open</option>
              <option value="closed">Closed</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="job-desc" class="form-label">Job Description *</label>
            <textarea id="job-desc" name="description" class="form-control" rows="4" placeholder="Enter job requirements and duties..." required></textarea>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Save Job Posting</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__content">
      <div>
        <a href="index.html" class="navbar__brand">JobSearch</a>
        <p class="text-muted">IS231 Web Technology</p>
      </div>
      <ul class="footer__links">
        <li><a href="index.html">Home</a></li>
        <li><a href="jobs.html">Browse Jobs</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html">Sign Up</a></li>
        <li><a href="cover.html">Cover Page</a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
